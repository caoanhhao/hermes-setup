# Chặn cứng file bí mật cho gateway và mọi tiến trình con (terminal của agent, cron, plugin).
# systemd gắn các đường dẫn này thành không truy cập được trong namespace của service, nên model có làm theo
# SOUL hay không thì cũng không đọc được. Dấu "-" ở đầu: bỏ qua nếu đường dẫn chưa tồn tại lúc service khởi động.
# Không chặn ~/.hermes/.env: gateway cần đọc key OpenCode và token Telegram trong đó.
# %h = home, %t = /run/user/<uid>
[Service]
InaccessiblePaths=-%h/.ssh -%h/.gnupg -%h/.password-store -%h/.pki -%h/.local/share/keyrings
InaccessiblePaths=-%h/.netrc -%h/.git-credentials -%h/.npmrc -%h/.docker -%h/.config/gh -%h/.aws -%h/.kube
InaccessiblePaths=-%h/.claude.json -%h/.claude -%h/.codex -%h/.copilot -%h/.gemini
InaccessiblePaths=-%h/.mozilla -%h/.config/chromium -%h/.config/google-chrome -%h/.config/BraveSoftware
InaccessiblePaths=-%h/.bash_history -%h/.zsh_history -%h/.histfile -%h/.python_history
InaccessiblePaths=-%t/gnupg -%t/keyring -/run/docker.sock
